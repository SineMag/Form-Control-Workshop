<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Control</title>
  <link rel="stylesheet" href="App.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

     <main id="root" class="container">
<section id="getName"> Hello, what is your name?<input id="name"> <button id="btnName" onclick="displayUserName()" >Save</button> </section>

<section id="fillForm">
        <div class="hello text-center " >
      <p>Hello <span id="userName"></span> <br>Would you like to fill in a form?</p>
      <button class="btn btn-success m-2 btn-md" id="yesButton">Yes</button>
      <button class="btn btn-danger m-2" id="noButton">No</button>
      <h1 id="byeMessage" class="fw-bold text-primary mt-3" hidden>Thank you! Bye!</h1>
    </div>
    </section>

 <section id="formSection">
   
 
    
    <h1 class="text-center text-white bg-success">Form JS Workshop</h1>

    <form id="myForm" >
      <label class="formLabel m-4" for="numOne">Enter a number</label>
      <input class="formControl m-4 w-50" type="text" id="numOne" name="myForm">
      <br>
      <span class="bg-danger text-darkred p-1" id="notNumber" hidden>This is not a number</span>
      <br>

      <label class="formLabel m-4" for="userEmail">Enter your email</label>
      <input class="formControl m-4 w-50" type="text" id="userEmail" name="userEmail">
      <br>
      <span id="invalidEmail" hidden>Please enter a valid email</span>

      <br>
      <button type="submit" class="btn btn-primary m-2">Submit</button>
      <button type="button" id="displayBtn" class="btn btn-secondary m-2">Display</button>
    </form>
  </main>
  </section>

  <script src="./App.js" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
